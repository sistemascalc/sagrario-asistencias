name: Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - run: pnpm test
      - name: Keep personal records out of public releases
        run: node -e "if(require('fs').existsSync('data/seed.json'))throw Error('Personal seed data must not be published');"
      - name: Build installer and update metadata
        run: pnpm dist
      - name: Publish release sequentially
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw 'The tag must match package.json version.'
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Sagrario Asistencias $version" --notes-file RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the release.' }
          }
          gh release upload $tag "release/Sagrario-Asistencias-Setup-$version.exe" "release/Sagrario-Asistencias-Setup-$version.exe.blockmap" --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the installer.' }
          gh release upload $tag release/latest.yml --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload update metadata.' }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Sagrario-Windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
